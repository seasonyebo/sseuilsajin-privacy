<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-labelledby="title desc">
  <title id="title">쓰일사진 로고</title>
  <desc id="desc">파란 배경 위 사진 프레임, 시계, 주황색 포인트로 구성된 쓰일사진 앱 로고</desc>
  <defs>
    <linearGradient id="bg" x1="24" y1="20" x2="232" y2="238" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2f63b7"/>
      <stop offset="0.55" stop-color="#2557aa"/>
      <stop offset="1" stop-color="#123f91"/>
    </linearGradient>
    <radialGradient id="glow" cx="0" cy="0" r="1" gradientTransform="translate(74 50) rotate(48) scale(210)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#5c83cb" stop-opacity="0.42"/>
      <stop offset="1" stop-color="#17458f" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="256" height="256" rx="48" fill="url(#bg)"/>
  <rect width="256" height="256" rx="48" fill="url(#glow)"/>

  <!-- photo frame -->
  <path d="M45 215V66C45 54.4 54.4 45 66 45H180" fill="none" stroke="#fff4dc" stroke-width="13" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M207 69V134" fill="none" stroke="#fff4dc" stroke-width="13" stroke-linecap="round"/>
  <path d="M45 190V202C45 211.4 52.6 219 62 219H139" fill="none" stroke="#fff4dc" stroke-width="13" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- clock badge -->
  <circle cx="198" cy="50" r="23" fill="#fff4dc"/>
  <circle cx="198" cy="50" r="11.5" fill="#ff8a3d"/>

  <!-- clock face -->
  <circle cx="100" cy="100" r="38" fill="#fff4dc"/>
  <path d="M100 101L77 87" fill="none" stroke="#17458f" stroke-width="6" stroke-linecap="round"/>
  <path d="M100 101L124 87" fill="none" stroke="#17458f" stroke-width="6" stroke-linecap="round"/>
  <circle cx="100" cy="101" r="5.5" fill="#17458f"/>

  <!-- photo landscape -->
  <path d="M47 193C63 178 74 163 90 160C104 157 111 168 124 168C137 168 146 154 161 146C176 138 190 143 194 154V169H178C170.8 169 165 174.8 165 182V192H147C139.8 192 134 197.8 134 205V215H63C54.2 215 47 207.8 47 199V193Z" fill="#fff4dc"/>

  <!-- dissolving pixels -->
  <rect x="154" y="181" width="16" height="16" rx="4" fill="#fff4dc"/>
  <rect x="183" y="180" width="16" height="16" rx="4" fill="#fff4dc"/>
  <circle cx="208" cy="162" r="7.5" fill="#ff8a3d"/>
  <circle cx="213" cy="188" r="7.5" fill="#fff4dc"/>
  <rect x="155" y="207" width="16" height="16" rx="4" fill="#fff4dc"/>
  <circle cx="192" cy="215" r="7.5" fill="#ff8a3d"/>
</svg>
