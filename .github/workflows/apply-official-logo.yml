name: Apply official logo

on:
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'
  push:
    paths:
      - '.github/workflows/apply-official-logo.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace generated mark with official logo
        run: |
          python - <<'PY'
          from pathlib import Path

          css_old = '''  .brand-mark {
    position: relative;
    width: 70px;
    height: 70px;
    flex: 0 0 70px;
    border: 5px solid var(--ivory);
    border-radius: 8px;
  }
  .brand-mark::before {
    content: "";
    position: absolute;
    width: 28px;
    height: 28px;
    left: 16px;
    top: 16px;
    border: 4px solid var(--ivory);
    border-radius: 50%;
  }
  .brand-mark::after {
    content: "";
    position: absolute;
    width: 12px;
    height: 12px;
    right: -8px;
    top: -8px;
    border-radius: 50%;
    background: var(--orange);
    box-shadow: -44px 68px 0 -2px var(--orange);
  }
  .clock-hand {
    position: absolute;
    z-index: 1;
    width: 3px;
    height: 12px;
    left: 32px;
    top: 23px;
    border-radius: 2px;
    background: var(--ivory);
    transform-origin: 50% 10px;
    transform: rotate(36deg);
  }
  .clock-hand::after {
    content: "";
    position: absolute;
    width: 10px;
    height: 3px;
    left: 0;
    bottom: 1px;
    border-radius: 2px;
    background: var(--ivory);
    transform-origin: 1px 1px;
    transform: rotate(72deg);
  }
'''
          css_new = '''  .brand-logo {
    display: block;
    width: 70px;
    height: 70px;
    flex: 0 0 70px;
    border-radius: 16px;
    object-fit: cover;
    box-shadow: 0 10px 28px rgba(0, 0, 0, 0.24);
  }
'''
          markup_old = '        <div class="brand-mark" aria-hidden="true"><span class="clock-hand"></span></div>'
          markup_new = '        <img class="brand-logo" src="logo.svg" alt="쓰일사진 앱 로고" width="70" height="70">'
          mobile_old = '''    .brand-mark { width: 58px; height: 58px; flex-basis: 58px; }
    .brand-mark::before { left: 12px; top: 12px; width: 24px; height: 24px; }
    .brand-mark::after { box-shadow: -34px 56px 0 -3px var(--orange); }
    .clock-hand { left: 26px; top: 19px; }
'''
          mobile_new = '    .brand-logo { width: 58px; height: 58px; flex-basis: 58px; border-radius: 13px; }\n'

          for name in ('index.html', 'support.html'):
              path = Path(name)
              text = path.read_text(encoding='utf-8')
              assert css_old in text, f'missing old logo CSS in {name}'
              assert markup_old in text, f'missing old logo markup in {name}'
              assert mobile_old in text, f'missing mobile logo CSS in {name}'
              text = text.replace(css_old, css_new, 1)
              text = text.replace(markup_old, markup_new, 1)
              text = text.replace(mobile_old, mobile_new, 1)
              if '<link rel="icon" href="logo.svg" type="image/svg+xml">' not in text:
                  text = text.replace('  <meta name="theme-color" content="#123f91">', '  <meta name="theme-color" content="#123f91">\n  <link rel="icon" href="logo.svg" type="image/svg+xml">', 1)
              path.write_text(text, encoding='utf-8')

          workflow = Path('.github/workflows/apply-official-logo.yml')
          workflow.unlink()
          PY
      - name: Verify logo references
        run: |
          test -f logo.svg
          grep -q 'class="brand-logo" src="logo.svg"' index.html
          grep -q 'class="brand-logo" src="logo.svg"' support.html
          grep -q 'src="logo.svg"' README.md
          ! grep -q 'class="brand-mark"' index.html
          ! grep -q 'class="brand-mark"' support.html
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html support.html .github/workflows/apply-official-logo.yml
          git commit -m "fix: apply official logo across legal pages"
          git push
